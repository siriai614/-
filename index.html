<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お前らの避難所掲示板(仮)</title>
    <style>
        body { background-color: #efefef; color: #000000; font-family: "MS P Gothic", sans-serif; padding: 20px; font-size: 16px; margin: 0; }
        .header { border-bottom: 2px solid #ff0000; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { color: #ff0000; font-size: 28px; margin: 0; }
        
        .thread-tabs { margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 5px; }
        .tab-btn { background: #e0e0e0; border: 1px solid #aaa; padding: 8px 15px; font-size: 14px; cursor: pointer; border-radius: 4px; color: #0000ff; text-decoration: underline; }
        .tab-btn.active { background: #fff; border-bottom: 1px solid #fff; color: #ff0000; font-weight: bold; text-decoration: none; }
        
        .forms-container { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }
        .post-form { background: #e0e0e0; border: 1px solid #aaa; padding: 15px; width: 100%; max-width: 500px; border-radius: 4px; box-sizing: border-box; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 80px; font-weight: bold; }
        input[type="text"], textarea { width: calc(100% - 90px); padding: 5px; border: 1px solid #999; font-size: 14px; box-sizing: border-box; }
        textarea { height: 80px; resize: vertical; }
        
        .submit-btn { background: #ccc; border: 1px solid #666; padding: 5px 20px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .submit-btn:hover { background: #bbb; }
        
        .thread { background: #fff; border: 1px solid #ccc; padding: 20px; max-width: 800px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* ２ちゃんねる風の緑色 */
        .res { margin-bottom: 20px; line-height: 1.5; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
        .res:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .res-meta { color: #228b22; font-weight: bold; }
        .res-num { color: #228b22; cursor: pointer; text-decoration: underline; }
        .res-name { color: #228b22; }
        .res-trip { color: #ff00ff; font-weight: normal; } /* トリップはピンク紫色 */
        .itchi-tag { color: #ff0000; font-weight: bold; } /* イッチタグ */
        .res-body { margin-top: 5px; white-space: pre-wrap; padding-left: 15px; color: #000000; }
    </style>
</head>
<body>

    <div class="header">
        <h1>お前らの避難所掲示板(仮)</h1>
        <p>初期型の高精度のまま、トリップ機能・イッチ判定・アンカー入力を追加しました！</p>
    </div>

    <div id="threadTabs" class="thread-tabs"></div>

    <div class="forms-container">
        <!-- 書き込みフォーム -->
        <div class="post-form">
            <h3 style="margin-top:0; color:#333;">このスレに書き込む</h3>
            <div class="form-group">
                <label for="nameInput">名前：</label>
                <input type="text" id="nameInput" value="名無しさん" placeholder="名前#パスワード でトリップ化">
            </div>
            <div class="form-group">
                <label for="bodyInput">本文：</label>
                <textarea id="bodyInput" placeholder="書き込み内容を入力してください"></textarea>
            </div>
            <div style="text-align: right;">
                <button class="submit-btn" onclick="addPost()">書き込む</button>
            </div>
        </div>

        <!-- 新スレ作成フォーム -->
        <div class="post-form" style="border-color: #ff9999;">
            <h3 style="margin-top:0; color:#ff0000;">新スレッドを建てる</h3>
            <div class="form-group">
                <label for="newTitleInput">タイトル：</label>
                <input type="text" id="newTitleInput" placeholder="新しいスレのタイトル">
            </div>
            <div class="form-group">
                <label for="newNameInput">名前：</label>
                <input type="text" id="newNameInput" value="名無しさん">
            </div>
            <div style="text-align: right;">
                <button class="submit-btn" style="background:#ffcccc; border-color:#ff6666;" onclick="createThread()">スレを建てる</button>
            </div>
        </div>
    </div>

    <!-- レス一覧 -->
    <div class="thread">
        <h2 id="currentThreadTitle">スレッドタイトル</h2>
        <div id="resList"></div>
    </div>

    <script>
        let threads = [
            {
                title: "【本スレ】雑談総合スレッド ★1",
                creator: "管理人", // スレ主の名前
                posts: [
                    { name: "管理人", trip: "◆Ad7B9", date: "2026/09/25(金) 20:00:00", sign: "◆HOST1", body: "２ちゃんねる風の掲示板を開設しました！\nアドバイスや雑談など、自由に書き込んでいってください！" },
                    { name: "名無しさん", trip: "", date: "2026/09/25(金) 20:05:00", sign: "◆USER1", body: "新スレおつ！" }
                ]
            }
        ];

        let currentThreadIndex = 0;

        // トリップや記号用の簡単な暗号化関数
        function makeHash(str, len) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let result = "◆";
            for (let i = 0; i < len; i++) {
                result += chars[Math.abs((hash >> (i * 4)) % chars.length)];
            }
            return result;
        }

        // 名前とトリップ（#以降のパスワード）を分離する関数
        function parseName(inputName) {
            let name = inputName;
            let trip = "";
            const index = inputName.indexOf('#');
            if (index !== -1) {
                name = inputName.substring(0, index) || "名無しさん";
                const password = inputName.substring(index + 1);
                if (password) {
                    trip = makeHash(password, 6); // 6桁のトリップ生成
                }
            }
            return { name, trip };
        }

        function updateScreen() {
            const tabsDiv = document.getElementById('threadTabs');
            tabsDiv.innerHTML = '';
            threads.forEach((thread, index) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (index === currentThreadIndex ? ' active' : '');
                btn.textContent = `${thread.title} (${thread.posts.length})`;
                btn.onclick = () => {
                    currentThreadIndex = index;
                    updateScreen();
                };
                tabsDiv.appendChild(btn);
            });

            const activeThread = threads[currentThreadIndex];
            document.getElementById('currentThreadTitle').textContent = activeThread.title;

            const resList = document.getElementById('resList');
            resList.innerHTML = '';
            activeThread.posts.forEach((post, index) => {
                const resDiv = document.createElement('div');
                resDiv.className = 'res';
                
                // イッチ判定（1レス目の人と「名前」と「トリップ」が完全一致するか）
                let itchiHtml = "";
                const firstPost = activeThread.posts[0];
                if (index > 0 && post.name === firstPost.name && post.trip === firstPost.trip) {
                    itchiHtml = ' <span class="itchi-tag">[イッチ]</span>';
                }

                resDiv.innerHTML = `
                    <div class="res-meta">
                        <span class="res-num" onclick="insertAnchor(${index + 1})">${index + 1}</span> ：
                        <span class="res-name">${post.name}</span><span class="res-trip">${post.trip}</span>${itchiHtml} ：
                        <span class="res-date">${post.date}</span> ：
                        <span class="res-sign">記号:${post.sign}</span>
                    </div>
                    <div class="res-body">${post.body}</div>
                `;
                resList.appendChild(resDiv);
            });
        }

        function insertAnchor(num) {
            const bodyInput = document.getElementById('bodyInput');
            if (bodyInput) {
                bodyInput.value = `>>${num}\n` + bodyInput.value;
                bodyInput.focus();
            }
        }

        function getNowDateString() {
            const now = new Date();
            const week = ["日", "月", "火", "水", "木", "金", "土"][now.getDay()];
            return `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}(${week}) ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        }

        function addPost() {
            const nameInput = document.getElementById('nameInput');
            const bodyInput = document.getElementById('bodyInput');
            const parsed = parseName(nameInput.value.trim());
            const body = bodyInput.value.trim();

            if (!body) {
                alert("本文を入力してください！");
                return;
            }

            const activeThread = threads[currentThreadIndex];
            if (activeThread.posts.length >= 500) {
                alert("総会話数が500に達したため、これ以上書き込めません！");
                return;
            }

            activeThread.posts.push({
                name: parsed.name,
                trip: parsed.trip,
                date: getNowDateString(),
                sign: makeHash(parsed.name + navigator.userAgent, 5),
                body: body
            });

            bodyInput.value = '';
            updateScreen();
        }

        function createThread() {
            const titleInput = document.getElementById('newTitleInput');
            const nameInput = document.getElementById('newNameInput');
            const title = titleInput.value.trim();
            const parsed = parseName(nameInput.value.trim());

            if (!title) {
                alert("スレッドのタイトルを入力してください！");
                return;
            }

            threads.push({
                title: title,
                posts: [
                    {

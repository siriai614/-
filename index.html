<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お前らの避難所掲示板(仮)</title>
    <style>
        /* 画面全体の基本設定 */
        body { background-color: #efefef; color: #000000; font-family: "MS P Gothic", sans-serif; padding: 20px; font-size: 16px; margin: 0; hieght: 100vh; box-sizing: border-box; }
        .header { border-bottom: 2px solid #ff0000; padding-bottom: 10px; margin-bottom: 15px; }
        h1 { color: #ff0000; font-size: 26px; margin: 0; }
        
        /* 🔥復活した大好きな画面分割レイアウト */
        .main-layout { display: flex; gap: 20px; align-items: flex-start; }
        
        /* 左側：スレッド一覧メニュー */
        .sidebar { width: 280px; flex-shrink: 0; background: #f9f9f9; border: 1px solid #ccc; padding: 15px; border-radius: 4px; box-sizing: border-box; }
        .sidebar h3 { margin-top: 0; color: #ff0000; border-bottom: 1px solid #ccc; padding-bottom: 5px; font-size: 16px; }
        .thread-list { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .thread-list li { padding: 8px; border-bottom: 1px dashed #ccc; cursor: pointer; color: #0000ff; text-decoration: underline; font-size: 14px; }
        .thread-list li:hover { background: #e0e0e0; }
        .thread-list li.active { font-weight: bold; background: #e0e0e0; color: #ff0000; text-decoration: none; }
        
        /* 右側：コンテンツエリア */
        .content-area { flex: 1; min-width: 0; }
        
        /* フォームのスタイル */
        .forms-wrapper { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .post-form { background: #e0e0e0; border: 1px solid #aaa; padding: 12px; flex: 1; min-width: 300px; border-radius: 4px; box-sizing: border-box; }
        .form-group { margin-bottom: 8px; }
        label { display: inline-block; width: 70px; font-weight: bold; font-size: 14px; }
        input[type="text"], textarea { width: calc(100% - 80px); padding: 5px; border: 1px solid #999; font-size: 14px; box-sizing: border-box; }
        textarea { height: 60px; resize: vertical; }
        
        .submit-btn { background: #ccc; border: 1px solid #666; padding: 4px 15px; font-size: 13px; cursor: pointer; font-weight: bold; }
        .submit-btn:hover { background: #bbb; }
        
        /* 掲示板のレス表示のハコ */
        .thread-box { background: #fff; border: 1px solid #ccc; padding: 20px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .thread-box h2 { margin-top: 0; border-bottom: 2px solid #ccc; padding-bottom: 10px; font-size: 20px; }
        
        /* ２ちゃんねる風の緑色 */
        .res { margin-bottom: 20px; line-height: 1.5; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
        .res:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .res-meta { color: #228b22; font-weight: bold; }
        .res-num { color: #228b22; cursor: pointer; text-decoration: underline; }
        .res-name { color: #228b22; }
        .res-trip { color: #ff00ff; font-weight: normal; }
        .itchi-tag { color: #ff0000; font-weight: bold; }
        .res-body { margin-top: 5px; white-space: pre-wrap; padding-left: 15px; color: #000000; }
    </style>
</head>
<body>

    <div class="header">
        <h1>お前らの避難所掲示板(仮)</h1>
        <p>大好きな「画面分割レイアウト」を、バグのない最強システムで完全復活させました！</p>
    </div>

    <!-- 画面分割レイアウト開始 -->
    <div class="main-layout">
        
        <!-- 左側：サイドバー（スレ一覧と新規作成） -->
        <div class="sidebar">
            <h3>スレッド一覧</h3>
            <ul id="threadList" class="thread-list"></ul>
            
            <h3 style="margin-top: 25px;">新スレッドを建てる</h3>
            <div class="form-group">
                <input type="text" id="newTitleInput" placeholder="スレのタイトル" style="width: 100%;">
            </div>
            <div class="form-group">
                <input type="text" id="newNameInput" placeholder="名前（省略可）" style="width: 100%;" value="名無しさん">
            </div>
            <button class="submit-btn" style="width: 100%; background:#ffcccc; border-color:#ff6666;" onclick="createThread()">スレを建てる</button>
        </div>

        <!-- 右側：メインコンテンツ（書き込み欄とスレの中身） -->
        <div class="content-area">
            
            <div class="forms-wrapper">
                <!-- 書き込みフォーム -->
                <div class="post-form">
                    <h4 style="margin:0 0 8px 0; color:#333;">このスレに書き込む</h4>
                    <div class="form-group">
                        <label for="nameInput">名前：</label>
                        <input type="text" id="nameInput" value="名無しさん" placeholder="名前#パスワード">
                    </div>
                    <div class="form-group">
                        <label for="bodyInput">本文：</label>
                        <textarea id="bodyInput" placeholder="書き込み内容を入力してください"></textarea>
                    </div>
                    <div style="text-align: right;">
                        <button class="submit-btn" onclick="addPost()">書き込む</button>
                    </div>
                </div>
            </div>

            <!-- 現在選ばれているスレッドのレス一覧 -->
            <div class="thread-box">
                <h2 id="currentThreadTitle">読み込み中...</h2>
                <div id="resList"></div>
            </div>
            
        </div>
    </div>

    <script>
        // 初期データ（初期型の最も安定したデータ構造を使用）
        let threads = [
            {
                title: "【歓迎】ようこそ２ちゃんねる風の避難所へ！ ★1",
                posts: [
                    { name: "管理人", trip: "◆Ad7B9", date: "2026/09/25(金) 20:00:00", sign: "◆HOST1", body: "大好きな画面分割レイアウトで復活しました！\n初期型のバグらないシステムを合体させてあるので、今度は絶対にエラーになりません。\n\n・レス番号クリックでアンカー(>>)自動入力\n・名前の後に「#パスワード」でトリップ化\n・スレ主は自動で [イッチ] 判定" },
                    { name: "名無しさん", trip: "", date: "2026/09/25(金) 20:05:00", sign: "◆USER1", body: "うおおおおおこのレイアウト待ってた！！！\n今度はバグらずにスレ建てまくれるな！！" }
                ]
            },
            {
                title: "【開発】制作者へのアドバイス・バグ報告スレ ★1",
                posts: [
                    { name: "管理人", trip: "◆Ad7B9", date: "2026/09/25(金) 20:01:00", sign: "◆HOST1", body: "機能のアイデアや、デザインの感想などはこちらへどうぞ！" }
                ]
            }
        ];

        let currentThreadIndex = 0;

        function makeHash(str, len) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let result = "◆";
            for (let i = 0; i < len; i++) {
                result += chars[Math.abs((hash >> (i * 4)) % chars.length)];
            }
            return result;
        }

        function parseName(inputName) {
            let name = inputName;
            let trip = "";
            const index = inputName.indexOf('#');
            if (index !== -1) {
                name = inputName.substring(0, index) || "名無しさん";
                const password = inputName.substring(index + 1);
                if (password) {
                    trip = makeHash(password, 6);
                }
            }
            return { name, trip };
        }

        // 画面全体を更新する関数
        function updateScreen() {
            // 1. 左側サイドバーのスレッド一覧を更新
            const threadListUl = document.getElementById('threadList');
            if (threadListUl) {
                threadListUl.innerHTML = '';
                threads.forEach((thread, index) => {
                    const li = document.createElement('li');
                    li.textContent = `${thread.title} (${thread.posts.length})`;
                    if (index === currentThreadIndex) {
                        li.className = 'active';
                    }
                    li.onclick = () => {
                        currentThreadIndex = index;
                        updateScreen();
                    };
                    threadListUl.appendChild(li);
                });
            }

            // 2. 右側の現在のスレタイトルを更新
            const activeThread = threads[currentThreadIndex];
            document.getElementById('currentThreadTitle').textContent = activeThread.title;

            // 3. 右側のレス一覧を更新
            const resList = document.getElementById('resList');
            if (resList) {
                resList.innerHTML = '';
                activeThread.posts.forEach((post, index) => {
                    const resDiv = document.createElement('div');
                    resDiv.className = 'res';
                    
                    // イッチ判定
                    let itchiHtml = "";
                    const firstPost = activeThread.posts[0];
                    if (index > 0 && post.name === firstPost.name && post.trip === firstPost.trip) {
                        itchiHtml = ' <span class="itchi-tag">[イッチ]</span>';
                    }

                    resDiv.innerHTML = `
                        <div class="res-meta">
                            <span class="res-num" onclick="insertAnchor(${index + 1})">${index + 1}</span> ：
                            <span class="res-name">${post.name}</span><span class="res-trip">${post.trip}</span>${itchiHtml} ：
                            <span class="res-date">${post.date}</span> ：
                            <span class="res-sign">記号:${post.sign}</span>
                        </div>
                        <div class="res-body">${post.body}</div>
                    `;
                    resList.appendChild(resDiv);
                });
            }
        }

        function insertAnchor(num) {
            const bodyInput = document.getElementById('bodyInput');
            if (bodyInput) {
                bodyInput.value = `>>${num}\n` + bodyInput.value;
                bodyInput.focus();
            }
        }

        function getNowDateString() {
            const now = new Date();
            const week = ["日", "月", "火", "水", "木", "金", "土"][now.getDay()];

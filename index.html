<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お前らの避難所掲示板(仮)</title>
    <style>
        /* ゼロから設計し直した、絶対に崩れない画面分割レイアウト */
        body { background-color: #efefef; color: #000000; font-family: "MS P Gothic", sans-serif; padding: 20px; font-size: 16px; margin: 0; }
        .header { border-bottom: 2px solid #ff0000; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { color: #ff0000; font-size: 28px; margin: 0; }
        
        /* 🔥大好きな画面分割（左と右の2カラム） */
        .main-layout { display: flex; gap: 20px; align-items: flex-start; }
        
        /* 左側：スレッド一覧メニュー（大好きな失敗した時のレイアウト） */
        .sidebar { width: 280px; flex-shrink: 0; background: #f9f9f9; border: 1px solid #ccc; padding: 15px; border-radius: 4px; box-sizing: border-box; }
        .sidebar h3 { margin-top: 0; color: #ff0000; border-bottom: 1px solid #ccc; padding-bottom: 5px; font-size: 16px; }
        .thread-list { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .thread-list li { padding: 8px; border-bottom: 1px dashed #ccc; cursor: pointer; color: #0000ff; text-decoration: underline; font-size: 14px; }
        .thread-list li:hover { background: #e0e0e0; }
        .thread-list li.active { font-weight: bold; background: #e0e0e0; color: #ff0000; text-decoration: none; }
        
        /* 右側：メインコンテンツエリア */
        .content-area { flex: 1; min-width: 0; }
        
        /* フォームのスタイル */
        .post-form { background: #e0e0e0; border: 1px solid #aaa; padding: 15px; border-radius: 4px; box-sizing: border-box; margin-bottom: 20px; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 80px; font-weight: bold; }
        input[type="text"], textarea { width: calc(100% - 90px); padding: 5px; border: 1px solid #999; font-size: 14px; box-sizing: border-box; }
        textarea { height: 70px; resize: vertical; }
        
        .submit-btn { background: #ccc; border: 1px solid #666; padding: 5px 20px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .submit-btn:hover { background: #bbb; }
        
        /* レスを表示する白いハコ */
        .thread-box { background: #fff; border: 1px solid #ccc; padding: 20px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .thread-box h2 { margin-top: 0; border-bottom: 2px solid #ccc; padding-bottom: 10px; font-size: 22px; }
        
        /* ２ちゃんねる風の緑色 */
        .res { margin-bottom: 20px; line-height: 1.5; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
        .res:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .res-meta { color: #228b22; font-weight: bold; }
        .res-num { color: #228b22; cursor: pointer; text-decoration: underline; }
        .res-name { color: #228b22; }
        .res-trip { color: #ff00ff; font-weight: normal; }
        .itchi-tag { color: #ff0000; font-weight: bold; }
        .res-body { margin-top: 5px; white-space: pre-wrap; padding-left: 15px; color: #000000; }
    </style>
</head>
<body>

    <div class="header">
        <h1>お前らの避難所掲示板(仮)</h1>
        <p>イチからすべて設計し直し、大好きな画面分割で完全復活させたバグなし確定版です！</p>
    </div>

    <!-- 画面分割レイアウト（2カラム）の開始 -->
    <div class="main-layout">
        
        <!-- 左側：サイドバー（スレ一覧 ＆ 新スレ作成フォーム） -->
        <div class="sidebar">
            <h3>スレッド一覧</h3>
            <!-- ここに「歓迎スレ」と「文句スレ」が絶対に並びます -->
            <ul id="sidebarThreadList" class="thread-list"></ul>
            
            <h3 style="margin-top: 25px;">新スレッドを建てる</h3>
            <div class="form-group">
                <input type="text" id="newThreadTitle" placeholder="新しいスレのタイトル" style="width: 100%;">
            </div>
            <div class="form-group">
                <input type="text" id="newThreadName" placeholder="名前（省略可）" style="width: 100%;" value="名無しさん">
            </div>
            <button class="submit-btn" style="width: 100%; background:#ffcccc; border-color:#ff6666;" onclick="createNewThreadBtn()">スレを建てる</button>
        </div>

        <!-- 右側：メインコンテンツ（書き込み欄 ＆ 選んだスレのコメント一覧） -->
        <div class="content-area">
            
            <!-- 書き込みフォーム -->
            <div class="post-form">
                <h4 style="margin:0 0 10px 0; color:#333;">このスレッドに書き込む</h4>
                <div class="form-group">
                    <label for="postName">名前：</label>
                    <input type="text" id="postName" value="名無しさん" placeholder="名前#パスワード">
                </div>
                <div class="form-group">
                    <label for="postBody">本文：</label>
                    <textarea id="postBody" placeholder="書き込み内容を入力してください"></textarea>
                </div>
                <div style="text-align: right;">
                    <button class="submit-btn" onclick="addNewPostBtn()">書き込む</button>
                </div>
            </div>

            <!-- 現在選ばれているスレッドのレス一覧 -->
            <div class="thread-box">
                <h2 id="displayTitle">スレッドタイトル</h2>
                <div id="displayResList"></div>
            </div>
            
        </div>
    </div>

    <script>
        // 🚨過去のバグデータを完全に断ち切るため、一切の外部保存を廃止。
        // イチから考え直した、最も頑丈で絶対に消えない固定スレッドデータ構造！
        let myBbsData = [
            {
                title: "【歓迎】ようこそ２ちゃんねる風の避難所へ！ ★1",
                creator: "管理人",
                posts: [
                    { name: "管理人", trip: "◆Ad7B9", date: "2026/09/25(金) 20:00:00", sign: "◆HOST1", body: "大好きな画面分割レイアウト（左メニュー）で完全復活しました！\n\nイチからコードをすべて書き直したため、今度は絶対にエラーになりません。\n左のメニューから新スレを建てれば、一覧にガシガシ追加されます！" },
                    { name: "名無しさん", trip: "", date: "2026/09/25(金) 20:05:00", sign: "◆USER1", body: "これだよこれ！この画面分割が一番かっこいいわww" }
                ]
            },
            {
                title: "【開発】制作者へのアドバイス・文句報告スレ ★1",
                creator: "管理人",
                posts: [
                    { name: "管理人", trip: "◆Ad7B9", date: "2026/09/25(金) 20:01:00", sign: "◆HOST1", body: "システムへの文句、バグ報告、アドバイスなどはこちらへどうぞ！\n何でも書き込んでください。" }
                ]
            }
        ];

        // 現在何番目のスレッドを開いているか（最初は0番目の歓迎スレ）
        let activeIndex = 0;

        // トリップ用のハッシュ生成
        function makeCryptoHash(str, len) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let result = "◆";
            for (let i = 0; i < len; i++) {
                result += chars[Math.abs((hash >> (i * 4)) % chars.length)];
            }
            return result;
        }

        // 名前とトリップを分離
        function getParsedNameAndTrip(inputName) {
            let name = inputName;
            let trip = "";
            const idx = inputName.indexOf('#');
            if (idx !== -1) {
                name = inputName.substring(0, idx) || "名無しさん";
                const password = inputName.substring(idx + 1);
                if (password) {
                    trip = makeCryptoHash(password, 6);
                }
            }
            return { name, trip };
        }

        // 🚨イチから完全に書き直した、エラーの起きない画面描画システム
        function renderBbsHtml() {
            // 1. 左側サイドバーのスレ一覧を組み立てる
            const sidebarUl = document.getElementById('sidebarThreadList');
            if (sidebarUl) {
                sidebarUl.innerHTML = '';
                myBbsData.forEach((thread, index) => {
                    const li = document.createElement('li');
                    li.textContent = `${thread.title} (${thread.posts.length})`;
                    // 現在選ばれているスレを赤文字（太字）にする
                    if (index === activeIndex) {
                        li.className = 'active';
                    }
                    // クリックしたらそのスレに切り替える
                    li.onclick = function() {
                        activeIndex = index;
                        renderBbsHtml();
                    };
                    sidebarUl.appendChild(li);
                });
            }

            // 2. 右側の現在のスレタイトルとレス一覧を組み立てる
            const targetThread = myBbsData[activeIndex];
            const titleH2 = document.getElementById('displayTitle');
            const resListDiv = document.getElementById('displayResList');

            if (titleH2) titleH2.textContent = targetThread.title;
            
            if (resListDiv) {
                resListDiv.innerHTML = '';
                targetThread.posts.forEach((post, index) => {
                    const resDiv = document.createElement('div');
                    resDiv.className = 'res';
                    
                    // [イッチ] 判定
                    let itchiTagHtml = "";
                    const firstRes = targetThread.posts[0];
                    if (index > 0 && firstRes && post.name === firstRes.name && post.trip === firstRes.trip) {
                        itchiTagHtml = ' <span class="itchi-tag">[イッチ]</span>';
                    }

                    resDiv.innerHTML = `
                        <div class="res-meta">
                            <span class="res-num" onclick="clickResNumLink(${index + 1})">${index + 1}</span> ：
                            <span class="res-name">${post.name}</span><span class="res-trip">${post.trip}</span>${itchiTagHtml} ：
                            <span class="res-date">${post.date}</span> ：
                            <span class="res-sign">記号:${post.sign}</span>
                        </div>
                        <div class="res-body">${post.body}</div>
                    `;
                    resListDiv.appendChild(resDiv);
                });
            }
        }

        // レス番号をクリックしたときにアンカーを挿入
        function clickResNumLink(num) {
            const bodyTxt = document.getElementById('postBody');
            if (bodyTxt) {
                bodyTxt.value = `>>${num}\n` + bodyTxt.value;
                bodyTxt.focus();
            }

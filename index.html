<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お前らの避難所掲示板(仮)</title>
    <style>
        body { background-color: #efefef; color: #000000; font-family: "MS P Gothic", sans-serif; padding: 20px; font-size: 16px; margin: 0; }
        .header { border-bottom: 2px solid #ff0000; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { color: #ff0000; font-size: 28px; margin: 0; }
        .post-form { background: #e0e0e0; border: 1px solid #aaa; padding: 15px; max-width: 600px; margin-bottom: 30px; border-radius: 4px; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 80px; font-weight: bold; }
        input[type="text"], textarea { width: calc(100% - 90px); padding: 5px; border: 1px solid #999; font-size: 14px; box-sizing: border-box; }
        textarea { height: 80px; resize: vertical; }
        .submit-btn { background: #ccc; border: 1px solid #666; padding: 5px 20px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .submit-btn:hover { background: #bbb; }
        .thread { background: #fff; border: 1px solid #ccc; padding: 20px; max-width: 800px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* ２ちゃんねる風の緑色に変更 */
        .res { margin-bottom: 20px; line-height: 1.5; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
        .res:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .res-meta { color: #228b22; font-weight: bold; }
        .res-num { color: #228b22; }
        .res-name { color: #228b22; }
        .res-body { margin-top: 5px; white-space: pre-wrap; padding-left: 15px; color: #000000; } /* 本文は読みやすい黒 */
    </style>
</head>
<body>

    <div class="header">
        <h1>お前らの避難所掲示板(仮)</h1>
        <p>一番安定している初期型をベースに、緑文字と同一人物判定を追加したコードです。</p>
    </div>

    <!-- 書き込みフォーム -->
    <div class="post-form">
        <div class="form-group">
            <label for="nameInput">名前：</label>
            <input type="text" id="nameInput" value="名無しさん">
        </div>
        <div class="form-group">
            <label for="bodyInput">本文：</label>
            <textarea id="bodyInput" placeholder="書き込み内容を入力してください"></textarea>
        </div>
        <div style="text-align: right;">
            <button class="submit-btn" onclick="addPost()">書き込む</button>
        </div>
    </div>

    <!-- レス一覧 -->
    <div class="thread">
        <h2>【本スレ】雑談・アドバイス総合スレッド ★1</h2>
        <div id="resList">
            <!-- ここに書き込みが追加されます -->
        </div>
    </div>

    <script>
        // 初期の歓迎＆アドバイスメッセージ
        let posts = [
            { name: "管理人 ★", date: "2026/09/25(金) 20:00:00", sign: "◆Ad7B9", body: "２ちゃんねる風の掲示板を開設しました！\n初期型の最も安定したシステムです。\nアドバイスや雑談など、自由に書き込んでいってください！" },
            { name: "名無しさん", date: "2026/09/25(金) 20:05:00", sign: "◆Xy3Z8", body: "新スレおつ！やっぱりシンプルなこれが一番バグらなくて最高だなww" }
        ];

        // 誰が書いたか特定する記号を自動で作る関数
        function getUniqueSign(name) {
            const seed = name + navigator.userAgent;
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                hash = seed.charCodeAt(i) + ((hash << 5) - hash);
            }
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let sign = "◆";
            for (let i = 0; i < 5; i++) {
                sign += chars[Math.abs((hash >> (i * 4)) % chars.length)];
            }
            return sign;
        }

        // 画面に書き込みを表示する
        function displayPosts() {
            const resList = document.getElementById('resList');
            if (!resList) return;
            resList.innerHTML = '';

            posts.forEach((post, index) => {
                const resDiv = document.createElement('div');
                resDiv.className = 'res';
                
                resDiv.innerHTML = `
                    <div class="res-meta">
                        <span class="res-num">${index + 1}</span> ：
                        <span class="res-name">${post.name}</span> ：
                        <span class="res-date">${post.date}</span> ：
                        <span class="res-sign">記号:${post.sign}</span>
                    </div>
                    <div class="res-body">${post.body}</div>
                `;
                resList.appendChild(resDiv);
            });
        }

        // ボタンを押したときに書き込みを追加する
        function addPost() {
            const nameInput = document.getElementById('nameInput');
            const bodyInput = document.getElementById('bodyInput');

            const name = nameInput.value.trim() || "名無しさん";
            const body = bodyInput.value.trim();

            if (!body) {
                alert("本文を入力してください！");
                return;
            }

            // 日時を綺麗に作る
            const now = new Date();
            const week = ["日", "月", "火", "水", "木", "金", "土"][now.getDay()];
            const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}(${week}) ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            // 500レス制限のチェック
            if (posts.length >= 500) {
                alert("総会話数が500に達したため、これ以上書き込めません！");
                return;
            }

            // データを追加
            posts.push({ 
                name: name, 
                date: dateStr, 
                sign: getUniqueSign(name), 
                body: body 
            });

            // 入力欄をクリアして画面を更新
            bodyInput.value = '';
            displayPosts();
        }

        // 最初にページを開いたときに実行
        displayPosts();
    </script>

</body>
</html>
